<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.P.I.R.I.T. Login Automation - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 1.4rem;
      color: #00d4ff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 30px;
    }
    .browser-frame {
      width: 100%;
      max-width: 600px;
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
      border: 1px solid #2a2a4a;
    }
    .browser-bar {
      background: #12121e;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2a2a4a;
    }
    .browser-dots {
      display: flex;
      gap: 6px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }
    .browser-url {
      flex: 1;
      background: #0a0a14;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: #666;
      font-family: monospace;
    }
    .login-page {
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-page h2 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-page .sys-name {
      color: #00d4ff;
      font-size: 0.7rem;
      letter-spacing: 3px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }
    .form-group {
      width: 100%;
      max-width: 320px;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0a0a14;
      border: 1px solid #333;
      border-radius: 6px;
      color: #00ff88;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-group input.typing {
      border-color: #00d4ff;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }
    .form-group input.done {
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
    }
    .login-btn {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      background: #00d4ff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.3s, transform 0.1s;
    }
    .login-btn.clicked {
      background: #00ff88;
      transform: scale(0.97);
    }
    .login-btn.loading {
      background: #555;
      color: #aaa;
    }

    /* Terminal */
    .terminal {
      width: 100%;
      max-width: 600px;
      margin-top: 24px;
      background: #0d0d1a;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      overflow: hidden;
    }
    .terminal-bar {
      background: #12121e;
      padding: 8px 14px;
      font-size: 0.7rem;
      color: #666;
      border-bottom: 1px solid #2a2a4a;
    }
    .terminal-body {
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      min-height: 160px;
    }
    .terminal-body .line {
      opacity: 0;
      transition: opacity 0.3s;
    }
    .terminal-body .line.visible { opacity: 1; }
    .line .prefix { color: #00d4ff; }
    .line .success { color: #00ff88; }
    .line .info { color: #ffbd2e; }
    .line .error { color: #ff5f57; }

    /* Status badge */
    .status {
      margin-top: 20px;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .status.visible { opacity: 1; }
    .status.success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }

    .restart-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #444;
      color: #888;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .restart-btn.visible { opacity: 1; }
    .restart-btn:hover { border-color: #00d4ff; color: #00d4ff; }
  </style>
</head>
<body>
  <h1>S.P.I.R.I.T. Login Automation</h1>
  <p class="subtitle">Playwright Browser Automation Preview</p>

  <!-- Simulated browser -->
  <div class="browser-frame">
    <div class="browser-bar">
      <div class="browser-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="browser-url" id="urlBar">about:blank</div>
    </div>
    <div class="login-page">
      <h2>Miami-Dade County</h2>
      <div class="sys-name">S.P.I.R.I.T. System</div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="usernameInput" readonly>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" readonly>
      </div>
      <button class="login-btn" id="loginBtn">Sign In</button>
    </div>
  </div>

  <!-- Terminal output -->
  <div class="terminal">
    <div class="terminal-bar">Terminal &mdash; node login.js</div>
    <div class="terminal-body" id="terminalBody"></div>
  </div>

  <div class="status" id="statusBadge"></div>
  <button class="restart-btn" id="restartBtn" onclick="runDemo()">Replay Demo</button>

  <script>
    const lines = [
      { text: '<span class="prefix">$</span> node login.js', delay: 0 },
      { text: '<span class="info">Launching browser (headless: false)...</span>', delay: 800 },
      { text: '<span class="info">Navigating to:</span> https://spirit.miamidade.gov/login', delay: 1500, action: 'navigate' },
      { text: '<span class="info">Filling in credentials...</span>', delay: 2500, action: 'fillUser' },
      { text: '', delay: 3800, action: 'fillPass' },
      { text: '<span class="info">Submitting login form...</span>', delay: 5000, action: 'submit' },
      { text: '<span class="success">Screenshot saved: screenshots/login-1711800000.png</span>', delay: 6500 },
      { text: '<span class="success">Login successful!</span> Current URL: https://spirit.miamidade.gov/dashboard', delay: 7200, action: 'success' },
      { text: '<span class="info">Ready for post-login actions.</span>', delay: 8000 },
    ];

    function typeText(el, text, speed = 50) {
      return new Promise(resolve => {
        let i = 0;
        el.value = '';
        const interval = setInterval(() => {
          el.value += text[i];
          i++;
          if (i >= text.length) { clearInterval(interval); resolve(); }
        }, speed);
      });
    }

    async function runDemo() {
      const terminal = document.getElementById('terminalBody');
      const urlBar = document.getElementById('urlBar');
      const userInput = document.getElementById('usernameInput');
      const passInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const statusBadge = document.getElementById('statusBadge');
      const restartBtn = document.getElementById('restartBtn');

      // Reset
      terminal.innerHTML = '';
      urlBar.textContent = 'about:blank';
      userInput.value = '';
      userInput.className = '';
      passInput.value = '';
      passInput.className = '';
      loginBtn.className = 'login-btn';
      loginBtn.textContent = 'Sign In';
      statusBadge.className = 'status';
      restartBtn.className = 'restart-btn';

      for (const line of lines) {
        await new Promise(r => setTimeout(r, line === lines[0] ? 500 : line.delay - (lines[lines.indexOf(line) - 1]?.delay || 0)));

        if (line.text) {
          const div = document.createElement('div');
          div.className = 'line';
          div.innerHTML = line.text;
          terminal.appendChild(div);
          requestAnimationFrame(() => div.classList.add('visible'));
        }

        if (line.action === 'navigate') {
          urlBar.textContent = 'https://spirit.miamidade.gov/login';
        } else if (line.action === 'fillUser') {
          userInput.classList.add('typing');
          await typeText(userInput, 'jdoe@miamidade.gov', 60);
          userInput.classList.remove('typing');
          userInput.classList.add('done');
        } else if (line.action === 'fillPass') {
          passInput.classList.add('typing');
          await typeText(passInput, '••••••••••••', 80);
          passInput.classList.remove('typing');
          passInput.classList.add('done');
        } else if (line.action === 'submit') {
          loginBtn.classList.add('clicked');
          setTimeout(() => {
            loginBtn.classList.remove('clicked');
            loginBtn.classList.add('loading');
            loginBtn.textContent = 'Signing in...';
          }, 150);
        } else if (line.action === 'success') {
          loginBtn.classList.remove('loading');
          loginBtn.classList.add('clicked');
          loginBtn.textContent = 'Signed In';
          urlBar.textContent = 'https://spirit.miamidade.gov/dashboard';
          statusBadge.textContent = 'LOGIN SUCCESSFUL';
          statusBadge.className = 'status success visible';
        }
      }

      restartBtn.className = 'restart-btn visible';
    }

    // Auto-start
    setTimeout(runDemo, 600);
  </script>
</body>
</html>
