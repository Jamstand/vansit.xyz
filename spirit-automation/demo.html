<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.P.I.R.I.T. Mainframe Automation - Demo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    h1 { font-size: 1.2rem; color: #33ff33; margin-bottom: 6px; letter-spacing: 2px; }
    .subtitle { color: #666; font-size: 0.75rem; margin-bottom: 24px; }

    /* Mainframe terminal window */
    .mainframe {
      width: 100%;
      max-width: 720px;
      background: #000;
      border: 2px solid #333;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.05);
    }
    .mainframe-bar {
      background: #1a1a2e;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      font-size: 0.65rem;
      color: #888;
    }
    .mainframe-bar .title { color: #aaa; }
    .mainframe-bar .dots { display: flex; gap: 5px; }
    .mainframe-bar .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; } .dot.y { background: #ffbd2e; } .dot.g { background: #28c840; }

    .screen {
      padding: 16px 20px;
      font-size: 0.78rem;
      line-height: 1.5;
      min-height: 440px;
      color: #33ff33;
      position: relative;
      overflow: hidden;
    }
    .screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.15) 0px,
        rgba(0,0,0,0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }
    .row { white-space: pre; min-height: 1.5em; }
    .row.bright { color: #66ff66; font-weight: bold; }
    .row.white { color: #ffffff; }
    .row.dim { color: #1a8a1a; }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      background: #33ff33;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .highlight { color: #ffff33; }
    .typing-text { color: #33ff33; }

    .status-bar {
      background: #1a3a1a;
      padding: 4px 12px;
      font-size: 0.65rem;
      color: #33ff33;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #2a5a2a;
    }

    /* Python terminal */
    .terminal {
      width: 100%;
      max-width: 720px;
      margin-top: 20px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .terminal-bar {
      background: #1a1a2e;
      padding: 6px 12px;
      font-size: 0.65rem;
      color: #888;
      border-bottom: 1px solid #333;
    }
    .terminal-body {
      padding: 12px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      min-height: 140px;
    }
    .terminal-body .line { opacity: 0; transition: opacity 0.3s; }
    .terminal-body .line.visible { opacity: 1; }
    .t-green { color: #33ff33; }
    .t-yellow { color: #ffbd2e; }
    .t-cyan { color: #00d4ff; }
    .t-white { color: #ccc; }

    .badge {
      margin-top: 16px;
      padding: 6px 18px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .badge.visible { opacity: 1; }
    .badge.ok { background: rgba(51,255,51,0.12); color: #33ff33; border: 1px solid #33ff33; }

    .replay {
      margin-top: 14px;
      padding: 6px 18px;
      background: transparent;
      border: 1px solid #444;
      color: #888;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .replay.visible { opacity: 1; }
    .replay:hover { border-color: #33ff33; color: #33ff33; }
  </style>
</head>
<body>
  <h1>S.P.I.R.I.T. MAINFRAME AUTOMATION</h1>
  <p class="subtitle">py3270 TN3270 Terminal Emulation Preview</p>

  <!-- Simulated mainframe screen -->
  <div class="mainframe">
    <div class="mainframe-bar">
      <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
      <span class="title">Quick3270 - Session B - Session1.ecf</span>
      <span id="connStatus">Disconnected</span>
    </div>
    <div class="screen" id="screen"></div>
    <div class="status-bar">
      <span id="statusLeft">4B&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;B</span>
      <span id="statusRight">24/32</span>
    </div>
  </div>

  <!-- Python terminal -->
  <div class="terminal">
    <div class="terminal-bar">Terminal &mdash; python login.py</div>
    <div class="terminal-body" id="termBody"></div>
  </div>

  <div class="badge" id="badge"></div>
  <button class="replay" id="replayBtn" onclick="runDemo()">Replay Demo</button>

  <script>
    // The mainframe menu content (matching the real screenshot)
    const MENU_SCREEN = [
      '',
      '        CCCCCCCCCCC                     INFORMATION TECHNOLOGY DEPARTMENT',
      '        CCCCCCCCCCCCC',
      '              CCCC                      ITD HELP DESK: 305-596-4357',
      '  M I A M I - D A D E  CCC',
      '              CCCC                                DATE: 04/08/26',
      '  CCCCCCCCCCC CCCCCCCCCCCCC                       TIME: 09:02:07',
      '  CCCCCCCCCCC CCCCCCCCCCCCC                    IP ADDR: 10.28.98.4',
      '                                               LINK: PROD',
      '',
      '     YOU ARE CONNECTED TO MIAMI-DADE COUNTY MAINFRAME SYSTEMS.',
      '          THIS ACCESS IS FOR AUTHORIZED USE ONLY.',
      '',
      '',
      '  ------------------------- RESIDENT APPLICATIONS --------------------------',
      '',
      '  C = CRIMINAL JUSTICE AND COURTS       B = CRIMINAL JUSTICE BACKUP',
      '  P = POLICE SYSTEMS                    W = WATER AND SEWER SYSTEMS',
      '  F = FINANCIAL SYSTEMS                 N = GATEWAY1 (SESSION MANAGER)',
      '  G = GENERAL GOV\'T SYSTEMS             K = DEVELOPMENT TSO',
      '',
      '',
      '',
      '  PLEASE ENTER APPLICATION CODE: ',
    ];

    const LOGIN_SCREEN = [
      '',
      '  =========================================================================',
      '                    CRIMINAL JUSTICE AND COURTS SYSTEM',
      '                         S.P.I.R.I.T. APPLICATION',
      '  =========================================================================',
      '',
      '',
      '                          USERID:  __________',
      '                        PASSWORD:  __________',
      '',
      '',
      '                    PRESS ENTER TO SIGN IN',
      '',
      '',
      '',
      '          YOU ARE CONNECTED TO MIAMI-DADE COUNTY MAINFRAME SYSTEMS.',
      '               THIS ACCESS IS FOR AUTHORIZED USE ONLY.',
      '',
      '',
      '',
      '',
      '',
      '',
      '',
    ];

    const LOGGED_IN_SCREEN = [
      '',
      '  =========================================================================',
      '                    CRIMINAL JUSTICE AND COURTS SYSTEM',
      '                         S.P.I.R.I.T. APPLICATION',
      '  =========================================================================',
      '',
      '                                                    DATE: 04/08/26',
      '                   WELCOME, JDOE                    TIME: 09:02:15',
      '',
      '  ----------------------------- MAIN MENU ---------------------------------',
      '',
      '   1 = CASE INQUIRY                    5 = REPORTS',
      '   2 = NAME SEARCH                     6 = ADMINISTRATION',
      '   3 = WARRANT INQUIRY                 7 = UTILITIES',
      '   4 = BOOKING INQUIRY                 8 = SIGN OFF',
      '',
      '',
      '',
      '   PLEASE ENTER SELECTION: ',
      '',
      '',
      '  LAST LOGIN: 04/07/26  16:45:12',
      '',
      '',
    ];

    function renderScreen(lines) {
      const screen = document.getElementById('screen');
      screen.innerHTML = '';
      lines.forEach(line => {
        const row = document.createElement('div');
        row.className = 'row';
        row.textContent = line;
        screen.appendChild(row);
      });
    }

    function addTermLine(text) {
      const body = document.getElementById('termBody');
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = text;
      body.appendChild(div);
      requestAnimationFrame(() => div.classList.add('visible'));
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function typeOnScreen(row, col, text, speed = 80) {
      const screen = document.getElementById('screen');
      const rows = screen.querySelectorAll('.row');
      if (!rows[row]) return;
      let current = rows[row].textContent;
      for (let i = 0; i < text.length; i++) {
        const before = current.substring(0, col + i);
        const after = current.substring(col + i + 1);
        current = before + text[i] + after;
        rows[row].textContent = current;
        rows[row].classList.add('bright');
        await wait(speed);
      }
    }

    async function typeOnScreenMasked(row, col, length, speed = 80) {
      const screen = document.getElementById('screen');
      const rows = screen.querySelectorAll('.row');
      if (!rows[row]) return;
      let current = rows[row].textContent;
      for (let i = 0; i < length; i++) {
        const before = current.substring(0, col + i);
        const after = current.substring(col + i + 1);
        current = before + '*' + after;
        rows[row].textContent = current;
        rows[row].classList.add('bright');
        await wait(speed);
      }
    }

    async function runDemo() {
      const screen = document.getElementById('screen');
      const termBody = document.getElementById('termBody');
      const badge = document.getElementById('badge');
      const replayBtn = document.getElementById('replayBtn');
      const connStatus = document.getElementById('connStatus');

      // Reset
      screen.innerHTML = '';
      termBody.innerHTML = '';
      badge.className = 'badge';
      replayBtn.className = 'replay';
      connStatus.textContent = 'Disconnected';

      await wait(500);
      addTermLine('<span class="t-cyan">$</span> <span class="t-white">python login.py</span>');
      await wait(600);
      addTermLine('<span class="t-yellow">Connecting to IBMPRD.METRO-DADE.COM:23 (visible: True)...</span>');
      await wait(1200);

      // Show connection
      connStatus.textContent = 'Connected to IBMPRD.METRO-DADE.COM';
      addTermLine('<span class="t-green">Connected to mainframe.</span>');

      // Render the menu screen
      renderScreen(MENU_SCREEN);
      await wait(1000);

      // Type application code
      addTermLine('<span class="t-yellow">Entering application code: C</span>');
      await wait(500);
      await typeOnScreen(23, 34, 'C', 100);
      await wait(800);

      addTermLine('<span class="t-green">Application selected.</span>');
      await wait(400);

      // Transition to login screen
      screen.innerHTML = '';
      await wait(300);
      renderScreen(LOGIN_SCREEN);
      await wait(800);

      // Fill username
      addTermLine('<span class="t-yellow">Filling in credentials...</span>');
      await wait(500);
      await typeOnScreen(7, 43, 'JDOE      ', 70);
      await wait(400);

      // Fill password (masked)
      await typeOnScreenMasked(8, 43, 8, 90);
      await wait(600);

      // Submit
      addTermLine('<span class="t-yellow">Submitting login (Enter)...</span>');
      await wait(300);

      // Flash screen
      screen.style.opacity = '0.3';
      await wait(150);
      screen.style.opacity = '1';
      await wait(800);

      // Show logged-in screen
      renderScreen(LOGGED_IN_SCREEN);
      await wait(500);

      addTermLine('<span class="t-green">Login submitted!</span>');
      await wait(300);
      addTermLine('<span class="t-green">Login successful!</span> <span class="t-white">Screen: MAIN MENU</span>');
      await wait(300);
      addTermLine('<span class="t-yellow">Session is open. Close the x3270 window to exit.</span>');

      badge.textContent = 'MAINFRAME LOGIN SUCCESSFUL';
      badge.className = 'badge ok visible';
      await wait(400);
      replayBtn.className = 'replay visible';
    }

    setTimeout(runDemo, 400);
  </script>
</body>
</html>
